name: Release

# Pushing to the `release` branch builds the Windows and Linux packages (portable zip and MSI;
# tar.gz, .deb, .rpm), drafts a GitHub release named
# after [workspace.package] version in Cargo.toml (tag v<version>), uploads the packages and
# publishes it when every build passed. A version with a suffix (0.2.0-rc.1) is a pre-release.
# Run it by hand (workflow_dispatch) for a dry run that only builds and keeps the artifacts.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Read the version from Cargo.toml
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && /^version *=/{gsub(/.*= *"|".*/,""); print; exit}' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          # Built natively on GitHub's Arm runner (free for public repositories).
          - { arch: arm64, target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    env:
      REWIND_OS_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Build, sign, package
        shell: pwsh
        env:
          # Optional: a base64-encoded .pfx and its password. Without them the packages are built
          # unsigned and Windows SmartScreen warns on first launch; the step summary says so.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          # GitHub's Arm runner (free for public repositories).
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      REWIND_OS_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries for eframe, and rpmbuild for the .rpm
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev rpm
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Build and package
        run: ./packaging/linux/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release' && !cancelled() && !contains(needs.*.result, 'failure')
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Draft the release with every package
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          if [ "$state" = false ]; then
            echo "::error::$TAG is already published. Raise [workspace.package] version in Cargo.toml for a new release."
            exit 1
          fi
          flags=(--draft --target "$GITHUB_SHA" --title "Rewind OS $VERSION" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if [ "$state" = missing ]; then
            gh release create "$TAG" "${flags[@]}" dist/*
          else
            gh release upload "$TAG" --clobber dist/*
          fi
      - name: Publish the release
        run: |
          set -euo pipefail
          now="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          last="$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | last | .tagName // ""')"
          if [ -n "$last" ] && [ "$last" != "$TAG" ]; then
            before="$(gh release view "$last" --json assets --jq '.assets | length')"
            if [ "$now" -lt "$before" ]; then
              echo "::error::$TAG has $now files where $last had $before: it stays a draft."
              exit 1
            fi
          fi
          gh release edit "$TAG" --draft=false
          echo "Published $TAG with $now files." >> "$GITHUB_STEP_SUMMARY"
