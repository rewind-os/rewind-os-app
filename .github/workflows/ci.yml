name: CI

# Quality gates for every push to main and every pull request. Each system's job also runs the
# read-only CLI commands on a real machine of that system, so the registry, recycle bin, drive
# and autostart code runs somewhere other than a developer's computer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Linux tests, format and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries for eframe
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy for Windows (checks the Windows-only code paths)
        run: cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Clippy for macOS
        run: cargo clippy --locked --workspace --all-targets --target aarch64-apple-darwin -- -D warnings
      - run: cargo test --locked --workspace
      - name: Run the read-only tools on Linux
        run: |
          set -euo pipefail
          cargo build --locked --release -p rewind-os-cli
          cli=target/release/rewind-os-cli
          "$cli" --version
          for cmd in overview recommend "clean analyze" "startup list" "scan $RUNNER_TEMP --top 5"; do
            echo "==> rewind-os-cli $cmd"
            # shellcheck disable=SC2086
            "$cli" $cmd
          done
          "$cli" --json clean analyze | python3 -c 'import json,sys; json.load(sys.stdin)'
          if "$cli" leftovers; then echo "::error::leftovers should say it is not available on Linux"; exit 1; fi

  windows:
    name: Windows tests and smoke run
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p rewind-os -p rewind-os-cli
      - name: Run the read-only tools on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = '.\target\release\rewind-os-cli.exe'
          & $cli --version
          foreach ($cmd in @('overview', 'programs', 'leftovers', 'files C:\Windows', 'recommend', 'tweaks list')) {
            Write-Output "==> rewind-os-cli --json $cmd"
            $json = & $cli --json @($cmd -split ' ')
            if ($LASTEXITCODE -ne 0) { throw "$cmd failed with exit code $LASTEXITCODE" }
            $null = $json | ConvertFrom-Json
          }
          $analysis = & $cli --json clean analyze | ConvertFrom-Json
          if (-not ($analysis.data | Where-Object { $_.present })) { throw 'clean analyze found no junk location at all' }
          $overview = & $cli --json overview | ConvertFrom-Json
          if ($overview.data.drives.Count -lt 1) { throw 'overview found no drives' }
          & $cli --lang es clean analyze
          & $cli scan $env:RUNNER_TEMP --top 5
          & $cli startup list

  macos:
    name: macOS tests and smoke run
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p rewind-os -p rewind-os-cli
      - name: Run the read-only tools on macOS
        run: |
          set -euo pipefail
          cli=target/release/rewind-os-cli
          "$cli" --version
          "$cli" overview
          "$cli" recommend
          "$cli" clean analyze
          "$cli" scan "$RUNNER_TEMP" --top 5
          "$cli" --json clean analyze | python3 -c 'import json,sys; json.load(sys.stdin)'
