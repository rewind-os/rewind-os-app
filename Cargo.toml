[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.29.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
# Nothing here goes to crates.io; internal crates depend on each other by path.
publish = false

[workspace.dependencies]
ctrlc = "3"
# internal (layers, lowest first: i18n + platform = L0, engine = L1, ui + tui = L2)
rewind-os-i18n = { path = "crates/i18n" }
rewind-os-platform = { path = "crates/platform" }
rewind-os-engine = { path = "crates/engine" }
rewind-os-ui = { path = "crates/ui" }
rewind-os-tui = { path = "crates/tui" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
parking_lot = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
glob = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
sys-locale = "0.3"
trash = "5"
winreg = "0.56"
winapi-util = "0.1"
filesize = "0.2"
clap = { version = "4", features = ["derive"] }
# Colours in the CLI; clap already brings both.
anstream = "1"
anstyle = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
egui = "0.37"
rfd = "0.18"
# The terminal interface; brings crossterm.
ratatui = "0.30"
tempfile = "3"
flate2 = "1"
winresource = "0.1"
resvg = "0.50"
pelite = { version = "0.10", default-features = false, features = ["std", "derive_pod", "mmap"] }
ico = "0.5"
blake3 = { version = "1", features = ["pure"] }
same-file = "1"
sha2 = "0.10"
minisign-verify = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Small, fast native binaries.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
